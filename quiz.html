<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Quiz</title>
<style>
body { font-family: system-ui, -apple-system, sans-serif; background: #0D1117; margin: 0; padding: 20px; color: #E6EAF2; color-scheme: dark; }
.app { max-width: 700px; margin: auto; background: #161B22; border: 1px solid #2B3441; padding: 30px; border-radius: 14px; box-shadow: 0 12px 40px rgba(0,0,0,.45); }
h1 { color: #A3A6FF; margin-top: 0; }
.meta { color: #8D98AA; font-size: 14px; }
.btn { background: #8B8FFF; color: #0E1020; border: none; padding: 12px 24px; font-size: 16px; font-weight: 600; border-radius: 8px; cursor: pointer; transition: .2s; }
.btn:hover { background: #A3A6FF; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn.alt { background: #3A4556; color: #E6EAF2; }
.btn.alt:hover { background: #4A5768; }
.q-card { margin-bottom: 24px; border: 1px solid #2B3441; background: #1C232D; padding: 20px; border-radius: 10px; }
fieldset { border: none; padding: 0; margin: 0; }
legend { font-weight: 600; font-size: 18px; margin-bottom: 12px; width: 100%; }
.opt { display: flex; align-items: center; gap: 10px; padding: 10px; border: 1px solid #2B3441; border-radius: 8px; margin-bottom: 8px; cursor: pointer; background: #161B22; transition: .15s; }
.opt:hover { background: rgba(139,143,255,.12); border-color: #8B8FFF; }
.opt input { transform: scale(1.2); cursor: pointer; accent-color: #8B8FFF; }
.req-badge { color: #F87171; font-size: 12px; vertical-align: top; }
.timer { background: rgba(139,143,255,.16); color: #A3A6FF; padding: 6px 12px; border-radius: 20px; font-weight: bold; }
.timer.low { background: rgba(251,191,36,.18); color: #FBBF24; }
.img-preview { max-width: 100%; border-radius: 8px; margin-bottom: 12px; max-height: 320px; object-fit: contain; }
.feedback { padding: 12px; border-radius: 8px; margin-top: 12px; font-weight: 500; }
.feedback.ok { background: rgba(52,211,153,.14); color: #6EE7B7; }
.feedback.bad { background: rgba(248,113,113,.14); color: #FCA5A5; }
.feedback.mid { background: rgba(251,191,36,.14); color: #FCD34D; }
.prog { height: 6px; background: #2B3441; border-radius: 4px; margin-bottom: 16px; overflow: hidden; }
.prog > i { display: block; height: 100%; background: #8B8FFF; transition: width .2s; }
input[type=text], input[type=number], select { width: 100%; padding: 10px; border: 1px solid #3A4556; border-radius: 8px; font-size: 16px; background: #0D1117; color: #E6EAF2; box-sizing: border-box; }
:focus-visible { outline: 2px solid #8B8FFF; outline-offset: 2px; }
.nav-bar { display: flex; justify-content: space-between; margin-top: 20px; gap: 10px; }
</style>
</head>
<body>
<div id="root" class="app">Loading…</div>

<script type="module">
import { auth, db, signInAnonymously, doc, getDoc, setDoc, serverTimestamp } from "./firebase.js";

const QUIZ_ID = new URLSearchParams(location.search).get("id");
const PREVIEW = false;
let QUIZ;

const esc0 = s => String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");

function playerLogic() {
  const root = document.getElementById("root");
  const S = QUIZ?.settings || {};
  const R = QUIZ?.results || {};
  const PV = typeof PREVIEW !== "undefined" && PREVIEW;

  // Disable instant feedback pre-submission because keys are stored separately on server
  S.instantFeedback = false;

  let questions = [], answers = {}, checked = {}, idx = 0, timerId, deadline, participant = "", running = false;
  const logKey = "quizmaker_pro_logs";

  const esc = s => String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  const rich = s => esc(s).replace(/&lt;(\/?)(b|i|u|em|strong|code|sub|sup)&gt;/gi, "<$1$2>").replace(/&lt;br\s*\/?&gt;/gi, "<br>");
  const plain = s => String(s == null ? "" : s).replace(/<[^>]*>/g, "");
  const norm = s => String(s).normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/\s+/g, " ").trim().toLowerCase();
  const isChoice = q => ["multiple_choice", "checkboxes", "drop_list"].includes(q.type);
  const empty = a => a == null || a === "" || (Array.isArray(a) && !a.length);

  function readLogs() { try { return JSON.parse(localStorage.getItem(logKey) || "{}") || {}; } catch (e) { return {}; } }
  function getAttempts() { return PV ? 0 : (readLogs()[QUIZ_ID] || []).length; }
  function shuffle(a) { const r = [...a]; for (let i = r.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [r[i], r[j]] = [r[j], r[i]]; } return r; }

  function init() {
    const attempts = getAttempts();
    if (!QUIZ.questions || !QUIZ.questions.length) return root.innerHTML = `<h2>${esc(S.title || "Quiz")}</h2><p>This quiz has no questions yet.</p>`;
    if (S.maxAttempts > 0 && attempts >= S.maxAttempts) return root.innerHTML = `<h2>Limit Reached</h2><p>You have reached the maximum allowed attempts (${S.maxAttempts}) for this quiz.</p>`;
    
    root.innerHTML = `<h1>${esc(S.title || "Quiz")}</h1>
      ${PV ? '<div class="meta">Preview mode: attempts are not recorded.</div>' : ""}
      <div class="meta">${QUIZ.questions.length} Questions${S.timeLimit > 0 ? ` • ${S.timeLimit} Mins` : ""}</div>
      ${S.description ? `<p>${rich(S.description)}</p>` : ""}
      <div style="margin:20px 0">
        <label for="pname" style="font-weight:600;display:block;margin-bottom:6px">Your Name</label>
        <input type="text" id="pname" autocomplete="name" placeholder="Enter your full name">
      </div>
      <button class="btn" id="startBtn">Start Quiz</button>`;

    document.getElementById("startBtn").onclick = start;
    document.getElementById("pname").onkeydown = e => { if (e.key === "Enter") start(); };
  }

  function start() {
    participant = document.getElementById("pname").value.trim();
    if (!participant) {
      document.getElementById("pname").focus();
      return;
    }
    answers = {}; checked = {}; idx = 0; running = true; window.__t0 = Date.now();
    questions = QUIZ.questions.map(q => {
      const c = JSON.parse(JSON.stringify(q));
      if (S.shuffleAnswers && isChoice(c)) c.options = shuffle(c.options);
      if (S.requireAll) c.required = true;
      return c;
    });
    if (S.shuffleQuestions) questions = shuffle(questions);
    clearInterval(timerId);
    if (S.timeLimit > 0) {
      deadline = Date.now() + S.timeLimit * 60000;
      timerId = setInterval(tick, 1000);
    }
    render();
  }

  function tick() {
    if (!deadline || !running) return;
    const left = Math.max(0, deadline - Date.now()), tel = document.getElementById("timer-disp");
    if (tel) {
      const s = Math.ceil(left / 1000);
      tel.textContent = `⏱ ${Math.floor(s / 60)}:${("0" + s % 60).slice(-2)}`;
      tel.className = "timer" + (s <= 60 ? " low" : "");
    }
    if (left <= 0) {
      clearInterval(timerId);
      submit(true);
    }
  }

  function render() {
    const isOne = S.displayMode === "one", toShow = isOne ? [questions[idx]] : questions;
    let html = `<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px">
      <h2 style="margin:0">${esc(S.title || "Quiz")}</h2>
      ${S.timeLimit > 0 ? '<span id="timer-disp" class="timer" role="timer"></span>' : ""}
    </div>`;
    if (isOne) html += `<div class="prog" role="progressbar" aria-valuemin="1" aria-valuenow="${idx + 1}" aria-valuemax="${questions.length}"><i style="width:${(idx + 1) / questions.length * 100}%"></i></div>`;
    
    toShow.forEach((q, i) => {
      const n = isOne ? idx + 1 : i + 1, a = answers[q.id], name = "a_" + q.id, dis = checked[q.id] ? "disabled" : "";
      html += `<div class="q-card" id="qcard_${q.id}">
        <fieldset>
          <legend>${n}. ${rich(q.title)} ${q.required ? '<span class="req-badge" title="Required" aria-label="required">*</span>' : ""}</legend>
          ${q.imageUrl ? `<img src="${esc(q.imageUrl)}" class="img-preview" alt="${esc(q.imageAlt || "")}" onerror="this.style.display='none'">` : ""}
          ${q.type === "multiple_choice" || q.type === "checkboxes" ? 
            q.options.map(o => {
              const type = q.type === "checkboxes" ? "checkbox" : "radio";
              const c = (type === "checkbox" && a && a.includes(o.id)) || (type === "radio" && a === o.id) ? "checked" : "";
              return `<label class="opt"><input type="${type}" name="${name}" value="${esc(o.id)}" ${c} ${dis} onchange="window.__updateAns('${q.id}','${q.type}')"> <span>${rich(o.text)}</span></label>`;
            }).join("")
            : q.type === "drop_list" ?
              `<select name="${name}" aria-label="Answer" ${dis} onchange="window.__updateAns('${q.id}','${q.type}')"><option value="">Select...</option>${q.options.map(o => `<option value="${esc(o.id)}" ${a === o.id ? "selected" : ""}>${esc(plain(o.text))}</option>`).join("")}</select>`
              : `<input type="${q.type === "number" ? "number" : "text"}" name="${name}" value="${esc(a)}" placeholder="Type your answer..." aria-label="Answer" ${q.type === "number" ? 'step="any"' : ""} ${dis} oninput="window.__updateAns('${q.id}','${q.type}')">`
          }
          <div id="fb_${q.id}" aria-live="polite"></div>
        </fieldset>
      </div>`;
    });

    if (isOne) {
      const q = questions[idx], last = idx === questions.length - 1;
      html += `<div class="meta" style="text-align:center">Question ${idx + 1} of ${questions.length}</div>
        <div class="nav-bar">
          <button class="btn alt" id="prevBtn" ${idx === 0 ? "disabled" : ""}>Back</button>
          <button class="btn" id="nextBtn">${last ? "Submit Quiz" : "Next"}</button>
        </div>`;
    } else {
      html += `<button class="btn" id="submitBtn" style="width:100%">Submit Quiz</button>`;
    }

    root.innerHTML = html;
    tick();
    attachEvents(isOne);
  }

  function extractVal(qId, type) {
    const els = document.getElementsByName("a_" + qId);
    if (!els.length) return null;
    if (type === "checkboxes") return Array.from(els).filter(e => e.checked).map(e => e.value);
    if (type === "multiple_choice") { const c = Array.from(els).find(e => e.checked); return c ? c.value : null; }
    return els[0].value.trim() || null;
  }

  window.__updateAns = (qId, type) => {
    answers[qId] = extractVal(qId, type);
  };

  function validateCurrent(qs) {
    for (const q of qs) {
      const v = extractVal(q.id, q.type), fb = document.getElementById("fb_" + q.id);
      if (q.required && empty(v)) {
        if (fb) { fb.className = "feedback bad"; fb.textContent = "This question is required."; }
        const el = document.getElementById("qcard_" + q.id);
        if (el) el.scrollIntoView({ block: "center", behavior: "smooth" });
        const f = document.getElementsByName("a_" + q.id)[0];
        if (f) f.focus();
        return false;
      }
      if (fb) { fb.className = ""; fb.textContent = ""; }
      answers[q.id] = v;
    }
    return true;
  }

  function score(q, ans) {
    if (empty(ans)) return 0;
    if (q.type === "multiple_choice" || q.type === "drop_list") {
      const c = q.options.find(o => o.isCorrect);
      return c && c.id === ans ? 1 : 0;
    }
    if (q.type === "checkboxes") {
      const cor = q.options.filter(o => o.isCorrect).map(o => o.id);
      if (!cor.length) return 0;
      const hit = ans.filter(v => cor.includes(v)).length, bad = ans.length - hit;
      if (!bad && hit === cor.length) return 1;
      return S.partialCredit ? Math.max(0, (hit - bad) / cor.length) : 0;
    }
    const key = String(q.answerText == null ? "" : q.answerText).trim();
    if (!key) return 0;
    if (q.type === "number") {
      const a = Number(ans), b = Number(key);
      return isFinite(a) && isFinite(b) && Math.abs(a - b) <= 1e-9 * Math.max(1, Math.abs(b)) ? 1 : 0;
    }
    return key.split("|").some(x => norm(x) === norm(ans)) ? 1 : 0;
  }

  function ansText(q, a) {
    if (empty(a)) return "—";
    if (isChoice(q)) {
      const ids = [].concat(a);
      return q.options.filter(o => ids.includes(o.id)).map(o => plain(o.text)).join(", ") || "—";
    }
    return String(a);
  }

  function correctText(q) {
    if (isChoice(q)) return q.options.filter(o => o.isCorrect).map(o => plain(o.text)).join(", ") || "—";
    return String(q.answerText || "—").split("|").join(" / ");
  }

  function attachEvents(isOne) {
    if (!isOne) {
      document.getElementById("submitBtn").onclick = () => submit();
      return;
    }
    const q = questions[idx], last = idx === questions.length - 1;
    const p = document.getElementById("prevBtn"), n = document.getElementById("nextBtn");
    if (p) p.onclick = () => { answers[q.id] = extractVal(q.id, q.type); idx--; render(); };
    if (n) n.onclick = () => { if (!validateCurrent([q])) return; if (last) submit(); else { idx++; render(); } };
  }

  function submit(force) {
    const cur = S.displayMode === "one" ? [questions[idx]] : questions;
    if (force) {
      cur.forEach(q => {
        const v = extractVal(q.id, q.type);
        if (v !== null) answers[q.id] = v;
      });
    } else if (!validateCurrent(cur)) {
      return;
    }

    clearInterval(timerId);
    running = false;

    if (window.CLOUD && !window.CLOUD.done) {
      root.innerHTML = "<p>Sending your submission…</p>";
      window.CLOUD.send({ name: participant, answers }).then(key => {
        questions.forEach(q => {
          const k = key[q.id];
          if (!k) return;
          q.options.forEach(o => o.isCorrect = (k.correct || []).includes(o.id));
          q.answerText = k.answerText || "";
          q.explanation = k.explanation || "";
          if (k.points != null) q.points = k.points;
        });
        window.CLOUD.done = true;
        finish();
      }).catch(e => {
        window.CLOUD.fail(e, () => submit(true));
      });
      return;
    }
    finish();

    function finish() {
      let earned = 0, total = 0;
      questions.forEach(q => {
        const p = q.points === "" || q.points == null || isNaN(Number(q.points)) ? 1 : Math.max(0, Number(q.points));
        total += p;
        earned += p * score(q, answers[q.id]);
      });
      earned = Math.round(earned * 100) / 100;
      const pct = total > 0 ? (earned / total * 100) : 0, shown = Math.round(pct);
      const rec = { date: Date.now(), name: participant || "Anonymous", earned, total, pct };

      if (!PV) {
        try {
          const L = readLogs();
          (L[QUIZ_ID] = L[QUIZ_ID] || []).push(rec);
          localStorage.setItem(logKey, JSON.stringify(L));
        } catch (e) {}

        if (S.webhookUrl) {
          try {
            fetch(S.webhookUrl, {
              method: "POST",
              mode: "no-cors",
              headers: { "Content-Type": "text/plain" },
              body: JSON.stringify({
                quiz: S.title,
                quizId: QUIZ_ID,
                ...rec,
                answers: questions.map(q => ({
                  question: plain(q.title),
                  answer: ansText(q, answers[q.id]),
                  credit: score(q, answers[q.id])
                }))
              })
            }).catch(() => {});
          } catch (e) {}
        }
      }

      let msg = "Quiz completed!";
      const r = (QUIZ.ranges || []).find(x => shown >= x.min && shown <= x.max);
      if (r && r.msg) msg = r.msg.replace(/\{score\}/g, shown + "%");

      let html = `<div style="text-align:center;padding:30px;background:#1C232D;border:1px solid #2B3441;border-radius:12px">
        <h2>${esc(msg)}</h2>
        <p style="font-size:18px">You scored <strong>${shown}%</strong> (${earned} / ${total} points)</p>
      </div>`;

      if (R.showAnswers) {
        html += `<h3 style="margin-top:30px">Review</h3>`;
        questions.forEach((q, i) => {
          const f = score(q, answers[q.id]);
          const col = f === 1 ? "#34D399" : f > 0 ? "#FBBF24" : "#F87171";
          const lab = f === 1 ? "Correct" : f > 0 ? "Partial" : "Incorrect";
          html += `<div class="q-card" style="border-left:4px solid ${col}">
            <div style="font-weight:600;margin-bottom:8px">${i + 1}. ${rich(q.title)}</div>
            <div class="meta">Status: <strong style="color:${col}">${lab}</strong></div>
            <div class="meta" style="margin-top:6px">Your answer: <strong>${esc(ansText(q,answers[q.id]))}</strong></div>
            ${f === 1 ? "" : `<div class="meta" style="margin-top:6px">Correct answer: <strong>${esc(correctText(q))}</strong></div>`}
            ${q.explanation ? `<div style="margin-top:8px;padding:8px;background:#161B22;border-radius:6px"><em>${rich(q.explanation)}</em></div>` : ""}
          </div>`;
        });
      }

      html += `<div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:20px">
        <button class="btn alt" id="dlBtn">Download my result</button>
        ${R.allowRetake ? '<button class="btn" id="retryBtn">Try Again</button>' : ""}
      </div>`;

      root.innerHTML = html;
      const rb = document.getElementById("retryBtn");
      if (rb) rb.onclick = init;

      document.getElementById("dlBtn").onclick = () => {
        const cell = v => '"' + String(v).replace(/"/g, '""') + '"';
        const rows = [
          ["Quiz", S.title || "Quiz"],
          ["Name", participant || "Anonymous"],
          ["Score %", shown],
          ["Points", earned + "/" + total],
          ["Date", new Date().toISOString()],
          [],
          ["Question", "Your answer", "Correct answer", "Credit"]
        ].concat(questions.map(q => [plain(q.title), ansText(q, answers[q.id]), correctText(q), score(q, answers[q.id])]));

        const a = document.createElement("a");
        a.href = URL.createObjectURL(new Blob([rows.map(r => r.map(cell).join(",")).join("\n")], { type: "text/csv" }));
        a.download = ((S.title || "quiz").replace(/[^\w]+/g, "_")) + "_result.csv";
        a.click();
      };

      window.scrollTo(0, 0);
    }
  }

  window.addEventListener("beforeunload", e => { if (running) { e.preventDefault(); e.returnValue = ""; } });
  init();
}

(async () => {
  const box = document.getElementById("root");
  try {
    if (!QUIZ_ID) throw new Error("Missing Quiz ID");
    const user = (await signInAnonymously(auth)).user;
    const uid = user.uid;
    const subRef = doc(db, "quizzes", QUIZ_ID, "submissions", uid);

    const [qs, mine] = await Promise.all([
      getDoc(doc(db, "quizzes", QUIZ_ID)),
      getDoc(subRef)
    ]);

    if (!qs.exists()) throw new Error("Quiz document does not exist");

    QUIZ = qs.data();
    if (!QUIZ.settings) QUIZ.settings = {};
    if (!QUIZ.results) QUIZ.results = {};

    QUIZ.settings.maxAttempts = 0;
    QUIZ.settings.webhookUrl = "";
    QUIZ.results.allowRetake = false;

    if (mine.exists()) {
      box.innerHTML = `<h2>${esc0(QUIZ.settings.title || "Quiz")}</h2><p>You already submitted this quiz as <b>${esc0(mine.data().name)}</b>. Your teacher will grade and share your results.</p>`;
      return;
    }

    window.CLOUD = {
      done: false,
      send: async ({ name, answers }) => {
        const t0 = window.__t0 || Date.now();
        const cleanName = (typeof name === "string" && name.trim()) ? name.trim().slice(0, 60) : "Anonymous";
        
        try {
          await setDoc(subRef, {
            name: cleanName,
            answers: JSON.parse(JSON.stringify(answers || {})),
            startedAt: t0,
            submittedAt: serverTimestamp(),
            durationSec: Math.max(0, Math.round((Date.now() - t0) / 1000))
          });
        } catch (e) {
          if (!(await getDoc(subRef)).exists()) throw e;
        }

        const keySnap = await getDoc(doc(db, "quizKeys", QUIZ_ID));
        return keySnap.exists() && keySnap.data() ? (keySnap.data().key || {}) : {};
      },
      fail: (e, retry) => {
        box.innerHTML = `<p>Submission failed (${esc0(e.code || e.message || "error")}). Please check your connection and try again.</p>
          <button class="btn" id="rt">Try again</button>`;
        document.getElementById("rt").onclick = retry;
      }
    };

    playerLogic();
  } catch (e) {
    console.error("Quiz load error:", e);
    box.innerHTML = "<h2>Quiz not found</h2><p>This link is invalid or the quiz is closed by the instructor.</p>";
  }
})();
</script>
</body>
</html>
