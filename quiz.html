<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiz Application</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.8/purify.min.js"></script>
<style>
:root {
  --bg: #0D1117; --card-bg: #161B22; --card-inner: #1C232D;
  --border: #2B3441; --accent: #8B8FFF; --text: #E6EAF2; --text-muted: #8D98AA;
  --success: #34D399; --warning: #FBBF24; --danger: #F87171;
}
body { font-family: system-ui, -apple-system, sans-serif; background: var(--bg); margin: 0; padding: 20px; color: var(--text); color-scheme: dark; }
.app { max-width: 760px; margin: auto; background: var(--card-bg); border: 1px solid var(--border); padding: 28px; border-radius: 14px; box-shadow: 0 12px 40px rgba(0,0,0,.45); }
h1, h2 { color: var(--accent); margin-top: 0; }
.meta { color: var(--text-muted); font-size: 14px; }
.btn { background: var(--accent); color: #0E1020; border: none; padding: 12px 22px; font-size: 15px; font-weight: 600; border-radius: 8px; cursor: pointer; transition: .15s; }
.btn:hover { opacity: 0.9; }
.btn:disabled { opacity: .4; cursor: not-allowed; }
.btn.alt { background: #3A4556; color: var(--text); }
.nav-grid { display: flex; flex-wrap: wrap; gap: 8px; margin: 16px 0 24px 0; padding: 12px; background: var(--bg); border: 1px solid var(--border); border-radius: 10px; }
.q-chip { width: 36px; height: 36px; border-radius: 8px; border: 1px solid var(--border); background: var(--card-inner); color: var(--text-muted); font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; }
.q-chip.answered { background: rgba(52,211,153,.18); border-color: var(--success); color: var(--success); }
.q-chip.active { outline: 2px solid var(--accent); color: var(--accent); }
.skeleton { background: linear-gradient(90deg, #161B22 25%, #222A35 50%, #161B22 75%); background-size: 200% 100%; animation: pulse 1.5s infinite; border-radius: 8px; }
.sk-line { height: 18px; margin-bottom: 12px; }
.sk-card { height: 120px; margin-bottom: 20px; }
@keyframes pulse { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
dialog { background: var(--card-bg); color: var(--text); border: 1px solid var(--border); border-radius: 12px; padding: 24px; max-width: 440px; width: 90%; }
dialog::backdrop { background: rgba(0, 0, 0, 0.7); backdrop-filter: blur(3px); }
.q-card { margin-bottom: 20px; border: 1px solid var(--border); background: var(--card-inner); padding: 20px; border-radius: 10px; }
.opt { display: flex; align-items: center; gap: 10px; padding: 12px; border: 1px solid var(--border); border-radius: 8px; margin-bottom: 8px; cursor: pointer; background: var(--card-bg); }
.opt:hover { background: rgba(139,143,255,.12); border-color: var(--accent); }
.opt input { transform: scale(1.2); accent-color: var(--accent); }
.key-badge { padding: 2px 6px; font-size: 11px; font-weight: bold; border-radius: 4px; background: #2B3441; color: var(--text-muted); }
.timer { background: rgba(139,143,255,.16); color: var(--accent); padding: 6px 14px; border-radius: 20px; font-weight: bold; }
.timer.low { background: rgba(251,191,36,.18); color: var(--warning); }
input[type=text] { width: 100%; padding: 12px; border: 1px solid #3A4556; border-radius: 8px; font-size: 15px; background: var(--bg); color: var(--text); box-sizing: border-box; }
.nav-bar { display: flex; justify-content: space-between; margin-top: 20px; gap: 10px; }
</style>
</head>
<body>

<div id="root" class="app">
  <div class="skeleton sk-line" style="width: 40%"></div>
  <div class="skeleton sk-line" style="width: 70%"></div>
  <div class="skeleton sk-card"></div>
</div>

<dialog id="customModal">
  <h3 id="modalTitle" style="margin-top:0">Notice</h3>
  <p id="modalBody" style="color:var(--text-muted)"></p>
  <div style="display:flex;justify-content:flex-end;gap:10px;margin-top:20px">
    <button class="btn alt" id="modalCancel">Cancel</button>
    <button class="btn" id="modalConfirm">OK</button>
  </div>
</dialog>

<script type="module">
import { auth, db, signInAnonymously, doc, getDoc, setDoc, serverTimestamp } from "./firebase.js";

const params = new URLSearchParams(location.search);
let QUIZ_ID = params.get("id");
const PIN_CODE = params.get("pin");
let QUIZ;

const safeHTML = (str) => DOMPurify.sanitize(String(str || ""), {
  ALLOWED_TAGS: ['b', 'i', 'em', 'strong', 'a', 'code', 'p', 'br', 'span', 'ul', 'ol', 'li', 'img'],
  ALLOWED_ATTR: ['href', 'target', 'src', 'alt', 'style']
});

function showModal(title, body, showCancel = false) {
  return new Promise(resolve => {
    const dialog = document.getElementById("customModal");
    document.getElementById("modalTitle").textContent = title;
    document.getElementById("modalBody").textContent = body;
    const cancelBtn = document.getElementById("modalCancel");
    const confirmBtn = document.getElementById("modalConfirm");
    cancelBtn.style.display = showCancel ? "inline-block" : "none";
    const cleanup = () => { dialog.close(); confirmBtn.onclick = null; cancelBtn.onclick = null; };
    confirmBtn.onclick = () => { cleanup(); resolve(true); };
    cancelBtn.onclick = () => { cleanup(); resolve(false); };
    dialog.showModal();
  });
}

function playerLogic() {
  const root = document.getElementById("root");
  const S = QUIZ?.settings || {};

  let questions = [], answers = {}, idx = 0, timerId, deadline, participant = "", running = false;
  const isOne = S.displayMode === "one";

  function init() {
    root.innerHTML = `
      <h1>${safeHTML(S.title || "Quiz")}</h1>
      <div class="meta">${QUIZ.questions.length} Questions ${S.timeLimit > 0 ? `• ${S.timeLimit} Mins` : ""}</div>
      ${S.description ? `<p style="margin:16px 0">${safeHTML(S.description)}</p>` : ""}
      <div style="margin:24px 0">
        <label for="pname" style="font-weight:600;display:block;margin-bottom:8px">Your Full Name</label>
        <input type="text" id="pname" autocomplete="name" placeholder="Enter your full name to start">
      </div>
      <button class="btn" id="startBtn">Start Quiz</button>`;

    document.getElementById("startBtn").onclick = start;
    document.getElementById("pname").onkeydown = e => { if (e.key === "Enter") start(); };
  }

  function start() {
    participant = document.getElementById("pname").value.trim();
    if (!participant) {
      showModal("Required Field", "Please enter your name to proceed.");
      document.getElementById("pname").focus();
      return;
    }
    answers = {}; idx = 0; running = true; window.__t0 = Date.now();
    questions = QUIZ.questions;

    if (S.timeLimit > 0) {
      deadline = Date.now() + S.timeLimit * 60000;
      timerId = setInterval(tick, 1000);
    }
    renderContainer();
    bindKeyboardNav();
  }

  function tick() {
    if (!deadline || !running) return;
    const left = Math.max(0, deadline - Date.now()), tel = document.getElementById("timer-disp");
    if (tel) {
      const s = Math.ceil(left / 1000);
      tel.textContent = `⏱ ${Math.floor(s / 60)}:${("0" + s % 60).slice(-2)}`;
      tel.className = "timer" + (s <= 60 ? " low" : "");
    }
    if (left <= 0) {
      clearInterval(timerId);
      submit(true);
    }
  }

  function renderContainer() {
    root.innerHTML = `
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
        <h2 style="margin:0">${safeHTML(S.title || "Quiz")}</h2>
        ${S.timeLimit > 0 ? '<span id="timer-disp" class="timer"></span>' : ""}
      </div>
      <div id="palette-container"></div>
      <div id="question-mount"></div>
      <div id="nav-container"></div>`;

    updatePalette();
    renderQuestion();
  }

  function updatePalette() {
    const palette = document.getElementById("palette-container");
    if (!palette) return;

    palette.innerHTML = `
      <div class="nav-grid">
        ${questions.map((q, i) => {
          const isAns = answers[q.id] != null && answers[q.id] !== "";
          return `<button class="q-chip ${isAns ? 'answered' : ''} ${isOne && i === idx ? 'active' : ''}" data-idx="${i}">${i+1}</button>`;
        }).join('')}
      </div>`;

    palette.querySelectorAll(".q-chip").forEach(chip => {
      chip.onclick = () => {
        if (isOne) {
          saveCurrentAnswer();
          idx = parseInt(chip.dataset.idx, 10);
          renderQuestion();
          updatePalette();
        } else {
          document.getElementById("qcard_" + questions[chip.dataset.idx].id)?.scrollIntoView({ behavior: "smooth" });
        }
      };
    });
  }

  function renderQuestion() {
    const mount = document.getElementById("question-mount");
    const nav = document.getElementById("nav-container");
    const toShow = isOne ? [questions[idx]] : questions;

    mount.innerHTML = toShow.map((q, i) => {
      const qNum = isOne ? idx + 1 : i + 1;
      const ans = answers[q.id];
      return `
        <div class="q-card" id="qcard_${q.id}">
          <legend style="font-weight:600;font-size:17px;margin-bottom:12px">
            ${qNum}. ${safeHTML(q.title)}
          </legend>
          <div class="options-group" data-qid="${q.id}">
            ${(q.options || []).map((o, oIdx) => `
              <label class="opt">
                <span class="key-badge">${oIdx + 1}</span>
                <input type="radio" name="a_${q.id}" value="${safeHTML(o.id)}" ${ans === o.id ? 'checked' : ''}>
                <span>${safeHTML(o.text)}</span>
              </label>
            `).join('')}
          </div>
        </div>`;
    }).join('');

    mount.querySelectorAll(".options-group").forEach(group => {
      group.addEventListener("change", (e) => {
        answers[group.dataset.qid] = e.target.value;
        updatePalette();
      });
    });

    if (isOne) {
      const isLast = idx === questions.length - 1;
      nav.innerHTML = `
        <div class="nav-bar">
          <button class="btn alt" id="prevBtn" ${idx === 0 ? "disabled" : ""}>Previous</button>
          <button class="btn" id="nextBtn">${isLast ? "Submit Quiz" : "Next"}</button>
        </div>`;

      document.getElementById("prevBtn").onclick = () => { saveCurrentAnswer(); idx--; renderQuestion(); updatePalette(); };
      document.getElementById("nextBtn").onclick = () => { saveCurrentAnswer(); if (isLast) submit(); else { idx++; renderQuestion(); updatePalette(); } };
    } else {
      nav.innerHTML = `<button class="btn" id="submitBtn" style="width:100%;margin-top:16px">Submit Quiz</button>`;
      document.getElementById("submitBtn").onclick = () => submit();
    }
  }

  function saveCurrentAnswer() {
    const q = questions[idx];
    if (!q) return;
    const sel = document.querySelector(`[data-qid="${q.id}"] input:checked`);
    answers[q.id] = sel ? sel.value : null;
  }

  function bindKeyboardNav() {
    document.addEventListener("keydown", (e) => {
      if (!running || !isOne) return;
      const q = questions[idx];
      if (!q) return;

      if (e.key >= "1" && e.key <= "9") {
        const optionIndex = parseInt(e.key, 10) - 1;
        const inputs = document.querySelectorAll(`[data-qid="${q.id}"] input`);
        if (inputs[optionIndex]) inputs[optionIndex].click();
      } else if (e.key === "ArrowRight" || e.key === "Enter") {
        document.getElementById("nextBtn")?.click();
      } else if (e.key === "ArrowLeft") {
        document.getElementById("prevBtn")?.click();
      }
    });
  }

  async function submit(forced = false) {
    saveCurrentAnswer();
    if (!forced) {
      const ok = await showModal("Submit Quiz", "Are you sure you want to finalize your submission?", true);
      if (!ok) return;
    }

    clearInterval(timerId);
    running = false;

    if (window.CLOUD) {
      root.innerHTML = "<h2>Submitting...</h2><div class='skeleton sk-card'></div>";
      try {
        await window.CLOUD.send({ name: participant, answers });
        root.innerHTML = `
          <div style="text-align:center;padding:30px">
            <h2>Submission Complete!</h2>
            <p style="color:var(--text-muted)">Your responses have been recorded by your teacher.</p>
          </div>`;
      } catch (err) {
        showModal("Submission Error", err.message || "Failed to submit.");
      }
    }
  }

  init();
}

(async () => {
  try {
    const user = (await signInAnonymously(auth)).user;

    if (!QUIZ_ID && PIN_CODE) {
      const codeSnap = await getDoc(doc(db, "quizCodes", PIN_CODE));
      if (codeSnap.exists()) QUIZ_ID = codeSnap.data().quizId;
    }

    if (!QUIZ_ID) throw new Error("No Quiz ID or PIN provided.");

    const subRef = doc(db, "quizzes", QUIZ_ID, "submissions", user.uid);
    const [qSnap, subSnap] = await Promise.all([
      getDoc(doc(db, "quizzes", QUIZ_ID)),
      getDoc(subRef)
    ]);

    if (!qSnap.exists()) throw new Error("Quiz does not exist.");
    QUIZ = qSnap.data();

    if (subSnap.exists()) {
      document.getElementById("root").innerHTML = `
        <h2>Already Submitted</h2>
        <p style="color:var(--text-muted)">You already submitted this quiz.</p>`;
      return;
    }

    window.CLOUD = {
      send: async ({ name, answers }) => {
        await setDoc(subRef, {
          name: DOMPurify.sanitize(name),
          answers: answers,
          startedAt: window.__t0 || Date.now(),
          submittedAt: serverTimestamp()
        });
      }
    };

    playerLogic();
  } catch (err) {
    document.getElementById("root").innerHTML = `
      <h2>Unable to Load Quiz</h2>
      <p style="color:var(--text-muted)">${safeHTML(err.message)}</p>`;
  }
})();
</script>
</body>
</html>
