<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Teacher Dashboard - QuizMaker Pro</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.8/purify.min.js"></script>
<style>
:root {
  --bg: #0D1117; --card: #161B22; --border: #2B3441;
  --accent: #8B8FFF; --text: #E6EAF2; --muted: #8D98AA;
  --danger: #F87171; --success: #34D399;
}
body { font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 24px; color-scheme: dark; }
.container { max-width: 900px; margin: auto; }
header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; border-bottom: 1px solid var(--border); padding-bottom: 16px; }
h1 { color: var(--accent); margin: 0; font-size: 24px; }
.btn { background: var(--accent); color: #0E1020; border: none; padding: 10px 18px; font-weight: 600; border-radius: 8px; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; font-size: 14px; }
.btn:hover { opacity: 0.9; }
.btn.alt { background: #3A4556; color: var(--text); }
.btn.danger { background: rgba(248,113,113,.2); color: var(--danger); border: 1px solid var(--danger); }
.btn.danger:hover { background: var(--danger); color: #000; }
.grid { display: grid; gap: 16px; }
.quiz-card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 20px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; }
.badge { background: rgba(52,211,153,.15); color: var(--success); padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; }
.badge.draft { background: rgba(141,152,170,.15); color: var(--muted); }
.pin-tag { background: #222A35; border: 1px solid var(--border); color: var(--accent); font-family: monospace; padding: 4px 8px; border-radius: 6px; font-weight: bold; font-size: 15px; }
.skeleton { background: linear-gradient(90deg, #161B22 25%, #222A35 50%, #161B22 75%); background-size: 200% 100%; animation: pulse 1.5s infinite; border-radius: 8px; height: 90px; }
@keyframes pulse { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
dialog { background: var(--card); color: var(--text); border: 1px solid var(--border); border-radius: 12px; padding: 24px; max-width: 400px; width: 90%; }
dialog::backdrop { background: rgba(0,0,0,0.7); backdrop-filter: blur(2px); }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>📋 Teacher Dashboard</h1>
    <div id="auth-box">Loading auth...</div>
  </header>

  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px">
    <h2 style="margin:0;font-size:18px">Your Quizzes</h2>
    <a href="editor.html" class="btn" id="new-btn" style="display:none">+ Create New Quiz</a>
  </div>

  <div id="quiz-list" class="grid">
    <div class="skeleton"></div>
    <div class="skeleton"></div>
  </div>
</div>

<dialog id="confirmModal">
  <h3 style="margin-top:0">Delete Quiz</h3>
  <p style="color:var(--muted)">Are you sure you want to delete this quiz? This action cannot be undone.</p>
  <div style="display:flex;justify-content:flex-end;gap:10px;margin-top:20px">
    <button class="btn alt" id="modalCancel">Cancel</button>
    <button class="btn danger" id="modalConfirm">Delete</button>
  </div>
</dialog>

<script type="module">
import { auth, db, signInWithPopup, GoogleAuthProvider, signOut, onAuthStateChanged, collection, query, orderBy, getDocs, doc, deleteDoc } from "./firebase.js";

const safeHTML = (str) => DOMPurify.sanitize(String(str || ""));

function showConfirm() {
  return new Promise(resolve => {
    const dialog = document.getElementById("confirmModal");
    const cancel = document.getElementById("modalCancel");
    const confirm = document.getElementById("modalConfirm");
    const cleanup = () => { dialog.close(); cancel.onclick = null; confirm.onclick = null; };
    cancel.onclick = () => { cleanup(); resolve(false); };
    confirm.onclick = () => { cleanup(); resolve(true); };
    dialog.showModal();
  });
}

onAuthStateChanged(auth, async (user) => {
  const authBox = document.getElementById("auth-box");
  const newBtn = document.getElementById("new-btn");

  if (user && user.email) {
    authBox.innerHTML = `
      <span style="font-size:14px;color:var(--muted);margin-right:10px">${safeHTML(user.email)}</span>
      <button class="btn alt" id="logoutBtn">Sign Out</button>`;
    document.getElementById("logoutBtn").onclick = () => signOut(auth);
    newBtn.style.display = "inline-flex";
    loadQuizzes();
  } else {
    authBox.innerHTML = `<button class="btn" id="loginBtn">Sign In with Google</button>`;
    document.getElementById("loginBtn").onclick = () => signInWithPopup(auth, new GoogleAuthProvider());
    newBtn.style.display = "none";
    document.getElementById("quiz-list").innerHTML = `<p style="color:var(--muted)">Please sign in as a teacher to manage your quizzes.</p>`;
  }
});

async function loadQuizzes() {
  const list = document.getElementById("quiz-list");
  try {
    const q = query(collection(db, "quizzes"), orderBy("updatedAt", "desc"));
    const snap = await getDocs(q);

    if (snap.empty) {
      list.innerHTML = `<p style="color:var(--muted)">No quizzes created yet. Click "+ Create New Quiz" to start.</p>`;
      return;
    }

    list.innerHTML = snap.docs.map(d => {
      const data = d.data();
      const id = d.id;
      const pin = data.pinCode || "N/A";
      const isPub = data.published ?? true;

      return `
        <div class="quiz-card" id="card_${id}">
          <div>
            <div style="display:flex;align-items:center;gap:10px;margin-bottom:6px">
              <h3 style="margin:0">${safeHTML(data.title || "Untitled Quiz")}</h3>
              <span class="badge ${isPub ? '' : 'draft'}">${isPub ? 'Published' : 'Closed'}</span>
            </div>
            <div style="color:var(--muted);font-size:14px">
              PIN: <span class="pin-tag">${safeHTML(pin)}</span> • ${data.questionCount || 0} Questions
            </div>
          </div>
          <div style="display:flex;gap:8px">
            <a href="quiz.html?pin=${safeHTML(pin)}" target="_blank" class="btn alt">Preview</a>
            <a href="editor.html?id=${id}" class="btn">Edit</a>
            <button class="btn danger" data-del="${id}" data-pin="${pin}">Delete</button>
          </div>
        </div>`;
    }).join("");

    list.querySelectorAll("[data-del]").forEach(btn => {
      btn.onclick = async () => {
        const id = btn.dataset.del;
        const pin = btn.dataset.pin;
        if (await showConfirm()) {
          await Promise.all([
            deleteDoc(doc(db, "quizzes", id)),
            deleteDoc(doc(db, "quizKeys", id)),
            pin !== "N/A" ? deleteDoc(doc(db, "quizCodes", pin)) : Promise.resolve()
          ]);
          document.getElementById("card_" + id)?.remove();
        }
      };
    });
  } catch (err) {
    list.innerHTML = `<p style="color:var(--danger)">Failed to load quizzes: ${safeHTML(err.message)}</p>`;
  }
}
</script>
</body>
</html>
